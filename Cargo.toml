[package]
name = "otoroshictl"
version = "0.0.18"
edition = "2024"
authors = ["mathieu.ancelin@cloud-apim.com"]
license = "Apache-2.0"
description = "a CLI to manage your otoroshi clusters with style ;)"
readme = "README.md"
repository = "https://github.com/cloud-apim/otoroshictl"
keywords = ["cli", "otoroshi", "apim", "otoroshi-as-code", "gitops"]
categories = ["command-line-utilities"]
documentation = "https://docs.rs/otoroshictl"

exclude = [
  "docs",
  "documentation",
]

[dependencies]
async-recursion = "1.2.0"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
cli-table = "0.5.0"
confy = { version = "2.0.0", features = ["yaml_conf"], default-features = false }
edit = "0.1.5"
env_logger = "0.11.11"
futures = { version = "0.3.34", features = ["thread-pool"] }
futures-channel = "0.3.34"
futures-util = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["full"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "native-tokio", "ring", "tls12", "logging"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "server-auto", "server-graceful", "http1", "http2", "tokio"] }
json_value_merge = "2.0.1"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
p256 = { version = "0.13", default-features = false, features = ["std", "pem", "pkcs8"] }
p384 = { version = "0.13", default-features = false, features = ["std", "pem", "pkcs8"] }
log = "0.4.34"
moka = { version = "0.12.16", features = ["sync", "future"] }
notify = "8.2.0"
paris = "1.5.15"
rand = "0.10.3"
rpassword = "7.5.4"
run_script = "0.11.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Not used directly: floor pulled by rustls, required to distrust the compromised eMudhra intermediates
rustls-webpki = { version = "0.103.16", default-features = false }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
trust-dns-resolver = "0.23.2"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
walkdir = "2.5.0"
webbrowser = "1.2.4"
webpki-roots = "1.0.10"

[dev-dependencies]
assert_cmd = "2.2.2"
rcgen = "0.14.10"
predicates = "3.1.4"
tempfile = "3.27.0"
serial_test = "4.0.1"
